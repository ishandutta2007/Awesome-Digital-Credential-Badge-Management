<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-orb {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .pulse-orb-rev {
      animation: pulseRev 7s ease-in-out infinite alternate;
    }
    .float-slow {
      animation: floatSlow 5s ease-in-out infinite alternate;
    }
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    .glow-badge {
      animation: badgeGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 1; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
    }
    @keyframes pulseRev {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.95; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    @keyframes badgeGlow {
      0% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      100% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.7)); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (Strictly in Background) -->
  <g opacity="0.85">
    <circle cx="180" cy="110" r="180" fill="url(#glowGrad1)" class="pulse-orb" />
    <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" class="pulse-orb-rev" />
    <circle cx="600" cy="210" r="140" fill="url(#glowGrad1)" opacity="0.3" class="pulse-orb" />
  </g>

  <!-- Subtle Dynamic Tech Flow Lines in Background -->
  <g opacity="0.4">
    <path d="M 50 80 Q 300 20 600 120 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-dash" />
    <path d="M 50 350 Q 350 400 700 300 T 1150 330" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-dash" />
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M 30 50 L 30 30 L 50 30" />
    <path d="M 1170 50 L 1170 30 L 1150 30" />
    <path d="M 30 370 L 30 390 L 50 390" />
    <path d="M 1170 370 L 1170 390 L 1150 390" />
  </g>

  <!-- Foreground Content Block (High Contrast, Centered, Crisp Typography) -->
  <g transform="translate(600, 195)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, -115)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="url(#accentGrad)" stroke-width="1.5" />
      <circle cx="-160" cy="0" r="6" fill="#10b981" />
      <text x="-142" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">AWESOME DIGITAL CREDENTIALS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Digital Credential &amp; Badge Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem of Open Badges, Verifiable Credentials &amp; Certification SaaS Platforms
    </text>

    <!-- Detailed Feature Tags in Floating Tray -->
    <g transform="translate(0, 52)" class="float-slow">
      <!-- Pill 1 -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="170" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="85" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🏅 Open Badges 3.0</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-185, 0)">
        <rect x="0" y="0" width="175" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🔐 W3C Verifiable Creds</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="175" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">⚡ Open-Source Issuers</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="175" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">💼 Enterprise SaaS TCO</text>
      </g>
    </g>

    <!-- Bottom Metric Highlight -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        Transparent Pricing • Free-Tier Limits • Market Valuation • Self-Hosted Frameworks
      </text>
    </g>
  </g>
</svg>
